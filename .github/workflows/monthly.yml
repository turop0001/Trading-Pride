name: Pult monthly report

on:
  schedule:
    # 1-го числа каждого месяца, 07:15 UTC (10:15 Рига летом / 09:15 зимой); в будни то же делает pult_tick.py с 10:00.
    - cron: '15 7 1 * *'
    - cron: '15 8 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: pult-tick
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Get state
        run: python -c "import state_sync; state_sync.pull()"
      - name: Monthly report
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        run: python monthly.py
      - name: Commit updated state
        run: |
          git config user.name "pult-bot"
          git config user.email "pult-bot@users.noreply.github.com"
          python -c "import state_sync; state_sync.push()"
