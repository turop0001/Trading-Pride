name: Pult loop (каждую минуту в окне)

on:
  schedule:
    # запуск с запасом ~25 мин (GitHub опаздывает на 5-20 мин): A 09:30 Рига, C 16:00 Рига; цикл ждёт начала окна. Зимой GitHub запускает на час раньше по Риге — цикл просто подождёт.
    # запас: GitHub пропускает/задерживает запуски (07.10 цикл C не стартовал) — несколько попыток, лишние запуски сразу выходят
    - cron: '15 6 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '10 7 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '45 12 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '15 13 * * 1-5'
    - cron: '30 13 * * 1-5'
  workflow_dispatch: {}
  repository_dispatch:
    types: [pult-loop]   # запасной запуск от сторожка на Vercel (/api/feed), если право запускать workflow у токена недоступно

permissions:
  contents: write

concurrency:
  group: pult-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Loop
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "pult-bot"; git config user.email "pult-bot@users.noreply.github.com"
          python pult_loop.py
