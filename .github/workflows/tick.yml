name: Pult tick

on:
  schedule:
    # Тип A (10:00-14:00 Рига) с запасом на переход летнего/зимнего времени: 07:00-11:00 UTC
    - cron: '*/5 7-10 * * 1-5'
    # после окна: ведение открытых сделок до 22:00 Рига (цель 3R / стоп / закрытие по времени), отчёт закрытия и отчёт дня
    - cron: '*/10 11-20 * * 1-5'
    # Тип C на паузе с 01.10.2026 (в отчётах только Тип A)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pult-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run tick
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pult_tick.py

      - name: Commit updated state
        run: |
          git config user.name "pult-bot"
          git config user.email "pult-bot@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "tick: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs origin main || true
            git push
          else
            echo "no state changes"
          fi
