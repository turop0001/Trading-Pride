name: Pult tick

on:
  schedule:
    # Проверки возвращены к настройкам до паузы + ведение сделок каждые 5 минут до закрытия сделки или 22:00 Рига.
    # Окна A (10:00-14:00) и C (16:30-18:30) на минутном цикле (loop.yml); эти запуски — страховка и ведение сделки.
    - cron: '*/5 7-19 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pult-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run tick
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pult_tick.py

      - name: Commit updated state
        run: |
          git config user.name "pult-bot"
          git config user.email "pult-bot@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "tick: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs origin main || true
            git push
          else
            echo "no state changes"
          fi
