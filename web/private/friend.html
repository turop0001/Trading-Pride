<title>Сигналы дня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{font-size:24px;font-weight:700;margin-right:auto}.brand span{color:var(--accent)}
.clock{display:flex;flex-direction:column;line-height:1.2}.clock small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.clock b{font-family:var(--mono);font-size:22px}
.winbox{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:999px;padding:5px 6px 5px 14px;background:var(--surface)}
.winbox .wt{font-family:var(--mono);font-size:18px;font-weight:600}
.tbadge{font-size:15px;font-weight:700;padding:4px 12px;border-radius:999px}
.tbadge.A{background:var(--blue-bg);color:var(--blue)} .tbadge.C{background:#efe3f6;color:#7a3f9a}
.pill{font-size:15px;font-weight:700;padding:6px 14px;border-radius:999px;white-space:nowrap}

.tabs{display:flex;gap:4px;background:var(--surface-2);padding:5px;border-radius:12px;overflow-x:auto}
.tab{flex:1;text-align:center;padding:12px 14px;border-radius:9px;font-size:17px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

.note{font-size:16px;color:var(--muted)}
.pos{color:var(--long)}.neg{color:var(--short)}
/* checklist */
.chead{display:flex;align-items:center;gap:10px;margin-bottom:6px}

.btn.primary{background:#1d7a4c;border-color:#1d7a4c;color:#fff;font-weight:700}

#zoomv{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}#zoomv.open{display:flex}#zoomv img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.nar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}.narI{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.narI small{font-size:12px;color:var(--muted);font-weight:500}
.nchip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-weight:700;font-size:14px}.nchip i{font-style:normal;font-family:var(--mono);font-weight:600;font-size:13px}

.mng{margin:10px 0 6px;padding:11px 14px;border-left:3px solid var(--long);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:16px;color:var(--muted)}
.mng b{color:var(--text)}
.verdict{margin-top:8px;padding:12px 14px;border:2px solid var(--border);border-radius:12px;background:var(--surface-2)}
.verdict .vr{font-size:23px;font-weight:700}.verdict .vh{font-size:16px;margin-top:2px}
/* kv */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:15px;color:var(--muted)}
.field input,.field select,.field textarea{font-family:var(--mono);font-size:19px;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);width:100%}
.field textarea{font-family:var(--sans);font-size:17px;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{background:var(--surface-2);border-radius:12px;padding:4px 14px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;padding:10px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:none}.kv>span:first-child{color:var(--muted)}
.kv .v{display:flex;align-items:baseline;gap:8px;white-space:nowrap}

.kv .v small{font-family:var(--mono);font-size:14px;color:var(--muted);min-width:46px;text-align:right}

th{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
th:first-child,td:first-child{text-align:left} td{font-family:var(--mono)} td:first-child{font-family:var(--sans)}

.tw{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px 14px}.kpi small{display:block;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.kpi b{font-family:var(--mono);font-size:26px}
.list{display:grid;gap:8px}.li{display:flex;justify-content:space-between;gap:12px;font-size:16px;border-bottom:1px dashed var(--border);padding-bottom:6px}.li:last-child{border-bottom:none}.li span{color:var(--muted)}.li b{font-family:var(--mono);font-weight:600;text-align:right}

.seg button.on[data-v="TP"]{background:var(--long-bg);color:var(--long)}.seg button.on[data-v="SL"]{background:var(--short-bg);color:var(--short)}.seg button.on[data-v="BE"]{background:var(--side-bg);color:var(--side)}
.seg button.on:not([data-v]){background:var(--surface);color:var(--text)}
/* report */
.repGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:18px}.repGrid>*{min-width:0}

.sym{font-family:var(--mono);font-size:26px;font-weight:600;margin-right:2px}

.liveBar{display:flex;flex-direction:column;gap:6px;padding:12px 16px}

.st.trade{background:#2f6fb5;color:#fff}.st.done{background:var(--surface-2);color:var(--text)}

.st.be{background:var(--side-bg);color:var(--side);border:1px solid var(--side)}
.rgrid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:9px 14px;font-size:17px;line-height:1.45}
@media (max-width:560px){.rgrid{grid-template-columns:1fr;gap:2px}.rgrid span{margin-top:8px;font-size:15px}}

.next{font-size:16px;padding:8px 11px;border-radius:9px;background:var(--surface-2);color:var(--muted)}

.shot{display:block;cursor:zoom-in;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fbfaf7}.shot img{display:block;width:100%;height:auto}
.lbx{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}.lbx img{max-width:100%;max-height:100%;border-radius:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:12px}

/* journal & stats */
.jform{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

function escA(t){return String(t||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function trPill(lbl,v){v=String(v||'—');var up=/▲/.test(v),dn=/▼/.test(v),cls=up?'long':dn?'short':'side';
  var w=up?'рост':dn?'падение':/сжат/.test(v)?'сжатие':/расшир/.test(v)?'расширение':v.replace(/[◆▲▼]\s*/,'');

function narrHTML(line){var p=String(line||'').split(' | ');if(p.length<2)return null;
  return '<div class="pxn">'+p.map(function(t){var c=/^(слом|CHoCH).*вверх/i.test(t)?'long':/^(слом|CHoCH)/i.test(t)?'short':/вероятнее вверх/i.test(t)?'long':/вероятнее вниз/i.test(t)?'short':/неясно/i.test(t)?'side':/^(Ликвидность|Цель-ликвидность|Обозначения)/i.test(t)?'liq':'';
    return '<span class="nl '+c+'">'+t.charAt(0).toUpperCase()+t.slice(1)+'</span>';}).join('')+'</div>';}
function ckBlock(kind,title,nums,cgi,pick){

  var tot=items.length,n=0;items.forEach(function(it){if(nums.indexOf(it[0])>=0)n++;});

  var head=kind==='minus'?(n?n+' из '+tot+' · условие не выполнено':'нет · всё в порядке'):kind==='plus'?(n+' из '+tot+(n?'':' · не сработали')):(n+' из '+tot+(n?'':' · пока ничего'));
  var chips=items.map(function(it){return '<span class="ch'+(nums.indexOf(it[0])>=0?' on':'')+'" title="'+escA(it[1])+'">'+it[0]+'</span>';}).join('');
  var det=items.map(function(it){var on=nums.indexOf(it[0])>=0;return '<div class="'+(on?'on':'')+'">'+(on?(kind==='minus'?'✕ ':'✓ '):'○ ')+it[0]+'. '+escA(it[1])+'</div>';}).join('');
  return '<div class="pxw"><details class="pxc k-'+kind+'"><summary><div class="pxh"><span>'+(kind==='req'?'Обязательные':kind==='cond'?'Условия входа':kind==='plus'?'Что усиливает':'Что ухудшает')+'</span><em>'+head+'</em></div><div class="pxbar"><i style="width:'+Math.round((kind==='minus'?(tot?n/tot:0):p)*100)+'%;background:'+col+'"></i></div><div class="pxchips">'+chips+'</div></summary><div class="pxd">'+det+'</div></details></div>';}
function liveCard(x){
  var dir=String(x.direction||''),es=/SHORT/.test(dir)?'short':/LONG/.test(dir)?'long':null;
  var m=STMAP[x.status]||['watch','Наблюдаем'];
  var cgi=CK[x.window]?CK[x.window].items:[];
  var rows=[['Направление (направление рынка)',dir||'—']];

  if(x.struct){var rc=x.struct.rec||'50/50',rcls=rc==='LONG'?'long':rc==='SHORT'?'short':'side';
    rows.push(['Структура','<div class="pxp st3">'+trPill('Swing',x.struct.swing)+trPill('Sub',x.struct.sub)+'<span class="pl rec '+rcls+'"><i>Рекомендация</i> '+(rc==='50/50'?'НЕТ ПРЕИМУЩЕСТВА · скип/осторожно':rc+(x.struct.conf?' · '+x.struct.conf:''))+'</span></div>']);

    rows.push(['Вероятность цели','<div class="pxp"><span class="pl prob-'+pc+'">'+x.prob+'</span></div>']);}

    var rq=[],cd=[],pl=[],nr=0,nc2=0,npl=0,nmin=0;

    (x.ck||[]).slice().sort(function(a,b){return a-b;}).forEach(function(n){var it=cgi[n-1];if(!it)return;if(it[0]==='plus')pl.push(n);else if(it[0]==='base')rq.push(n);else if(it[0]!=='minus')cd.push(n);});

    if(nmin)rows.push(['Ухудшители',ckBlock('minus','Ухудшители',x.worse||[],cgi,function(it){return it[0]==='minus';})]);

      var fb=x.ckf.filter(function(n){return cgi[n-1]&&cgi[n-1][0]==='base';}),fs=x.ckf.filter(function(n){return !(cgi[n-1]&&cgi[n-1][0]==='base');});
      if(fb.length)rows.push(['Не выполнено','<div class="pxp">'+fb.map(function(n){return '<span class="pl warn" title="'+escA(cgi[n-1]?cgi[n-1][1]:'')+'">№'+n+'</span>';}).join('')+'</div>']);
      if(fs.length)rows.push(['Сработал скип','<div class="pxp">'+fs.map(function(n){return '<span class="pl minus" title="'+escA(cgi[n-1]?cgi[n-1][1]:'')+'">№'+n+'</span>';}).join('')+'</div>']);}}
  if(x.why&&x.why.length)rows.push(['Все причины',x.why.join('; ')]);
  if(x.sl_why)rows.push(['Разбор SL',x.sl_why]);
  var curR=null;
  if(x.signal){var xt=x.exit_time?' · '+x.exit_time:'',isT=/→ TP/.test(x.note||''),isS=/→ SL/.test(x.note||'');
    rows.push(['Вход',x.signal.entry+' · '+x.signal.time]);rows.push(['Стоп',x.signal.stop+(isS?xt:'')]);rows.push(['Цель '+(x.signal.rr||2)+'R',x.signal.tp+(isT?xt:'')]);

      if(rk>0&&isFinite(pr)){var cr=Math.round((es==='short'?en-pr:pr-en)/rk*100)/100;curR=(cr>0?'+':'')+String(cr)+'R';}}}
  rows.push(['Проверено',(x.price!=null?x.price+' · ':'')+(x.checked||'—')]);
  return {s:x.sym,t:x.window,dir:es||'side',eside:es,st:m[0],stT:m[1],rows:rows,c:false,curR:curR};
}

  function stripBias(s){return String(s||'').replace(/bias\s*/gi,'').replace(/\s+/g,' ').trim();}
  function trTxt(t){if(!t)return null;if(typeof t==='string')return t;var tr=t.tr||t.trend||t.dir;if(!tr||tr==='нет данных')return null;var p=t.pct!=null?' ('+(t.pct>=0?'+':'')+t.pct+'%)':'';return tr+p;}
  function trDir(t){var v=t&&typeof t==='object'?(t.tr||''):String(t||'');v=v.toLowerCase();return v.indexOf('лонг')===0||v.indexOf('long')===0?'long':v.indexOf('шорт')===0||v.indexOf('short')===0?'short':v?'side':null;}
  function narChip(lbl,t){var d=trDir(t);if(!d)return '<span class="narI"><small>'+lbl+'</small> <span class="nchip off">нет данных</span></span>';var p=t&&t.pct!=null?(t.pct>0?'+':t.pct<0?'−':'')+Math.abs(t.pct).toFixed(2)+'%':'';
    return '<span class="narI"><small>'+lbl+'</small> <span class="nchip '+d+'">'+(d==='long'?'▲ LONG':d==='short'?'▼ SHORT':'◆ БОКОВИК')+(p?' <i>'+p+'</i>':'')+'</span></span>';}
  function narHtml(h,d){var a=trDir(h),b=trDir(d),tot=(a&&a===b&&a!=='side')?a:(a||b?'side':null);
    return '<span class="nar">'+narChip('H1 · 7 дн',h)+narChip('D1 · 14 дн',d)+(tot?'<span class="narI"><small>итог</small> <span class="nchip big '+tot+'">'+(tot==='long'?'LONG':tot==='short'?'SHORT':'50/50')+'</span></span>':'')+'</span>';}
  var RAWB='https://raw.githubusercontent.com/turop0001/Trading-Pride/state/';
  /* Тип A: 06.10.2026 добавлен обязательный №3, 07.10.2026 — №5 (вынос ≥0,5 ATR). Старые записи (ckv 1/2) переводим в нумерацию 1–16 */
  function ckm(k,r,a){if(!a||(r.window||k.split('_')[1])!=='A')return a;var v=r.ckv||1;if(v>=3)return a;return a.map(function(n){if(v<2&&n>=3)n++;if(n>=5)n++;return n;});}
  function toLive(k,r){
    var x={date:r.date,sym:r.sym||k.split('_')[0],window:r.window||k.split('_')[1],status:r.line_status,direction:stripBias(r.direction),
      note:r.note||r.tg_note,reasons:r.reasons,price:r.price,checked:r.checked_at,boxH:r.boxH,boxL:r.boxL,prevH:r.prevH,prevL:r.prevL,signal:r.signal,ck:ckm(k,r,r.ck),ckf:ckm(k,r,r.ckf),fx:r.fx,
      struct:r.struct,pos:r.pos,prob:r.prob,plus:ckm(k,r,r.plus),worse:ckm(k,r,r.worse),why:r.why,sl_why:r.sl_why,exit_time:r.exit_time};
    var wcl=x.window==='A'?840:1110;
    if(!x.signal&&(x.status==='watch'||x.status==='prep')&&(x.date<REPDAY||(x.date===REPDAY&&rigaMinutesNow()>=wcl))){x.status='skip';x.note='СКИП (вход не случился до '+(x.window==='A'?'14:00':'18:30')+')';x.ckf=[];}
    var c=liveCard(x);
    var isTP=/→ TP/.test(x.note||''),isSL=/→ SL/.test(x.note||''),isBE=/→ БУ/.test(x.note||'');
    if(isTP||isSL||isBE){c.res=isTP?'TP':isBE?'BE':'SL';c.stT=isTP?'Закрыта · TP':isBE?'Закрыта · БУ':'Закрыта · SL ❌';var sr=c.rows.find(function(z){return z[0]==='Статус';});if(sr)sr[1]='<span class="stchip '+(isTP?'tp':isBE?'be':'sl')+'">'+String(x.note).replace(/[<>&]/g,'')+'</span>';}
    c.rows=c.rows.filter(function(z){return z[0].indexOf('Направление')!==0;});
    c._sig=r.signal||null;c._e=(r.signal&&!(isTP||isSL||isBE))?0:(x.status==='prep'&&!(isTP||isSL||isBE))?1:(x.status==='watch'&&!(isTP||isSL||isBE))?2:3;
    var shotsHtml=null;if(r.shots&&(r.shots.m5||r.shots.h1)){shotsHtml='<a class="shots">'+['m5','h1'].filter(function(k){return r.shots[k];}).map(function(k){var u=RAWB+r.shots[k];return '<span class="shotw" data-u="'+u+'"><img src="'+u+'" alt="'+k+'"><small>'+(k==='m5'?'M5 · день входа':'H1 · 5 дней')+'</small></span>';}).join('')+'</a>';}
    if(shotsHtml)c.rows.push(['Графики сделки',shotsHtml]);
    c._w=x.window;c._s=x.sym;return c;
  }
  function applyState(S){
    if(!S||S.error){$('repNote').textContent='Ошибка загрузки данных: '+((S&&S.error)||'нет ответа');return;}
    var all=Object.keys(S).filter(function(k){return /_(A|C)$/.test(k)&&S[k]&&S[k].date;});
    var DAY=all.some(function(k){return S[k].date===REPDAY;})?REPDAY:all.map(function(k){return S[k].date;}).sort().pop();
    var keys=all.filter(function(k){return S[k].date===DAY;});
    $('repTitle').textContent='Отчёт дня · '+String(DAY||REPDAY).split('-').reverse().join('.')+(DAY&&DAY!==REPDAY?' (последний торговый день; сегодня проверок ещё не было)':'');
    REP=keys.map(function(k){return toLive(k,S[k]);}).sort(function(a,b){if(a._e!==b._e)return a._e-b._e;var ra=winRank(a._w),rb=winRank(b._w);if(ra!==rb)return ra-rb;return a._s<b._s?-1:1;});
    if(!REP.length)$('rep').innerHTML='<div class="empty">Сегодня проверок ещё не было — карточки появятся с открытием окна A (10:00 Рига).</div>';else renderRep();
    var log=(S._log||[]).map(function(r){return {date:r.date,time:r.time,window:(r.window&&r.window!=='—')?r.window:'закрыто',text:stripBias(r.text)};});
    var last=log[log.length-1];
    if(last){renderLive({date:last.date,time:last.time,window:last.window,text:last.text,log:log.filter(function(r){return r.date===last.date;})});}
    else $('liveLine').textContent='Проверок пока не было.';
  }
  function poll(){fetch('/api/state',{cache:'no-store'}).then(function(r){return r.json();}).then(applyState).catch(function(e){$('repNote').textContent='Ошибка загрузки данных: '+e;});}
  poll();setInterval(poll,30000);
})();
